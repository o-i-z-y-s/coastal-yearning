name: JS Syntax Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check JS syntax
        run: |
          find js -name '*.js' | sort | while read f; do
            node --check "$f" && echo "OK  $f" || exit 1
          done
